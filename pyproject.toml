[project]
name = "aether-dataset"
version = "0.1.0"
description = "Restartable LoquaciousSet to Mimi semantic cache builder"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "datasets>=4.0,<5",
  "huggingface-hub>=0.34,<2",
  "moshi>=0.2,<1",
  "numpy>=2.0,<3",
  "nvidia-ml-py>=13,<14",
  "psutil>=7,<8",
  "pyarrow>=20,<24",
  "pyyaml>=6,<7",
  "rich>=14,<15",
  "soundfile>=0.13,<1",
  "torch==2.9.1",
  "torchaudio==2.9.1",
]

[project.scripts]
aether-dataset = "aether_dataset.cli:main"

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aether_dataset"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
